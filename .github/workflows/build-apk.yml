name: Build BDAS Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "gradle"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 35
          build-tools: "35.0.0"

      - name: Check google-services.json
        run: |
          if [ ! -f "app/google-services.json" ]; then
            echo "app/google-services.json missing!"
            exit 1
          fi

      - name: Generate debug.keystore
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "debug.keystore" ]; then
            keytool -genkeypair \
              -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=BDAS Debug, OU=Android, O=BDAS, L=Dhaka, ST=Dhaka, C=BD"
          fi
          cp debug.keystore "$HOME/.android/debug.keystore"

      - name: Build Debug APK
        run: |
          gradle :app:assembleDebug --no-daemon

      - name: Verify APK exists
        id: verify_apk
        run: |
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
            echo "APK not found!"
            exit 1
          fi
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bdas-debug-apk
          path: ${{ steps.verify_apk.outputs.apk_path }}
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-latest
          name: "BDAS Debug APK (${{ github.run_number }})"
          body: "BDAS Debug APK build"
          files: ${{ steps.verify_apk.outputs.apk_path }}
          make_latest: false
